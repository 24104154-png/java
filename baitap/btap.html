<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hover Image</title>
  <style>
    #image {
      width: 400px;
      height: 300px;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: #eee;
      background-size: cover;
      background-position: center;
      background-image: url('');
    }
    .preview { width: 150px; margin: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="image">Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.</div>

  <img class="preview" alt="Mèo" src="cat.jpg"
       onmouseover="upDate(this)" onmouseleave="unDo()">
  <img class="preview" alt="Chó" src="dog.jpg"
       onmouseover="upDate(this)" onmouseleave="unDo()">
  <img class="preview" alt="Chim" src="bird.jpg"
       onmouseover="upDate(this)" onmouseleave="unDo()">

  <script src="script.js"></script>
</body>
</html>
